spring.application.name=mouss

# Port du Resource Server (API securisee)
server.port=8081

# Emetteur des jetons JWT : Keycloak (Realm enset-realm)
# Spring Security decouvre les cles publiques via les metadonnees OIDC de ce realm.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/enset-realm
